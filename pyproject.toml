[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-ai-loan-analysis"
version = "1.1.0"
description = "Public-safe utilities supporting a mixed-methods study of human-AI loan decisions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jithu Vathiath Biju"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
research = [
  "catboost>=1.2,<2",
  "cycler>=0.12,<1",
  "graphviz>=0.20,<1",
  "ipython>=8,<10",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "nbformat>=5.9,<6",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

